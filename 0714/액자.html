<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 200px;
            height: 100px;
            overflow: hidden;
            border-radius: 4px;
            border: 0.5px solid #cccc;
        }
        img {
            width: 200px;
            height: 100px;
            transition: transform 0.4s;
            
        }
        img:hover {
            transform: scale(1.05);
        }

    </style>
</head>
<body>
    <div>
        <img src="../TEST04/실습/sunset.png">
    </div>

    
</body>
</html>
