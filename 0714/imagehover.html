<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 200px;
            height: 100px;
            position: relative;
        }
        img {
            width: 200px;
            height: 100px;
        }
        .overlay {
            position: absolute;
            width: calc(100% - 20px); /* 계산해주는 값? */
            bottom: 0;
            background-color: rgb(0, 0, 0, 0.6);
            color: white;
            z-index: 1;
            opacity: 0; /* 투명도 0=투명, 1=불투명 */
            padding: 10px;
            transition: opacity 0.3s;
        }
        /* 부모의 ~를 자식에게 전파한다 */ 
        .container:hover .overlay {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="../TEST04/실습/sunset.png">
        <div class="overlay">설명 텍스트</div>
    </div>
</body>
</html>
